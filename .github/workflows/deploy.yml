name: Deploy to GitHub Pages and Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kilejofficial
          channelId: live

      # --- KROKI INDEKSOWANIA GOOGLE ---
      
      - name: Konfiguracja Node.js (dla bota indeksującego)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Utworzenie pliku klucza Google w domyślnym katalogu skryptu
        run: |
          mkdir -p ~/.gis
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > ~/.gis/service_account.json

      - name: Uruchomienie bota indeksującego Google
        run: npx google-indexing-script https://kilejofficial.web.app/
