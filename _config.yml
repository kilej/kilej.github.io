title: "Oficjalna Strona Artysty „Kiłej""
description: "Polski podziemny raper, autor tekstów i twórca niezależny z Wiechlic, mieszkający obok Szprotawy, gmina Żagań, województwo Lubuskie.Nagrywa od 2008 roku i ma na koncie trzy płyty, zawsze kładzie jakość nad ilością. Dyskografia: album grupy MwS 'Początek Końca' (2010), solowy album 'W zakazanym dziale' (2020) oraz album 'Obiegł' (2024), jego styl jest istotną profesją podziemia po latach praktyki."
url: "https://kilejofficial.web.app"


